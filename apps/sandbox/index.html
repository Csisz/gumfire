<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GUMFIRE Sandbox</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #14121a; color: #eee; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #app { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
      #stage { border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px #2c2838; max-width: 100%; }
      #stage canvas { display: block; max-width: 100%; height: auto; }
      #hud { display: grid; grid-template-columns: repeat(4, minmax(120px, auto)); gap: 4px 24px; }
      #hud b { color: #9fe870; font-weight: 600; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
      button { font: inherit; background: #262233; color: #eee; border: 1px solid #3b3550; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
      button:hover { background: #312b43; }
      #verdict.ok { color: #9fe870; } #verdict.bad { color: #ff6b6b; }
      .keys { color: #a39cb8; text-align: center; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="hud"></div>
      <div class="row">
        <button id="pause">Pause (P)</button>
        <button id="stepOnce">Step 1 tick (.)</button>
        <button id="verify">Verify determinism (V)</button>
        <button id="restart">Restart (R)</button>
        <span id="verdict"></span>
      </div>
      <div class="keys">Space: spawn · ←/→: push · Enter: kick · interpolation <b id="interp">on</b> (I)</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
